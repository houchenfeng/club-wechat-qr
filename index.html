<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启航AI俱乐部 交流群邀请</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="badge sticker-rot">WECHAT · GROUP INVITE</div>
  <h1>启航AI俱乐部<br><span class="hl">交流群邀请</span></h1>
  <p class="sub">扫码添加下方工作人员微信 → 说明来意 → 拉你进群</p>
</header>

<main class="grid">
  <section class="card card-yellow tilt-l">
    <div class="tag">STAFF 01</div>
    <img src="assets/qr-xingchen-dahai.jpg" alt="星辰大海的微信二维码">
    <h2>星辰大海</h2>
  </section>

  <section class="card card-pink tilt-l">
    <div class="tag">STAFF 02</div>
    <img src="assets/qr-serotonin.png" alt="Serotonin🍎的微信二维码">
    <h2>Serotonin🍎</h2>
  </section>

  <section class="card card-green tilt-r">
    <div class="tag">STAFF 03</div>
    <img src="assets/qr-yunyun.jpg" alt="云云的微信二维码">
    <h2>云云</h2>
  </section>
</main>

<footer class="foot">
  <p>若扫码失败请更换工作人员 · 添加时备注「社团+姓名」</p>
  <p class="small">QIHANG AI CLUB</p>
</footer>

</body>
</html>
